schema_version: "1.0.0"
project_name: "personal-website"
project_type: "public_repo"
context_pack: "public_context"
allowed_privacy:
  - "public_safe"
public_output_expected: true
needs:
  - "identity"
  - "verified_experience"
  - "public_links"
  - "claim_rules"
  - "public_project_map"
forbidden:
