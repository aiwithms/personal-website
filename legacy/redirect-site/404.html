<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta http-equiv="refresh" content="0;url=https://manishsharma.dev/" />
    <link rel="canonical" href="https://manishsharma.dev/" />
    <title>Manish Sharma Lab has moved</title>
    <script>
      (() => {
        const path = window.location.pathname.startsWith("/")
          ? window.location.pathname
          : `/${window.location.pathname}`;
        window.location.replace(
          `https://manishsharma.dev${path}${window.location.search}${window.location.hash}`
        );
      })();
    </script>
  </head>
  <body>
    <p>
      Manish Sharma Lab has moved to
      <a href="https://manishsharma.dev/">manishsharma.dev</a>.
    </p>
  </body>
</html>
